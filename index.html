<!DOCTYPE html>
<html lang="en" data-theme="light" data-color="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Navotex</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cpath%20d%3D%22M0%200H512V400L400%20512H0Z%22%20fill%3D%22%234f46e5%22%2F%3E%3Cpath%20d%3D%22M400%20512L512%20400H400Z%22%20fill%3D%22%23000%22%20fill-opacity%3D%22.3%22%2F%3E%3Cpath%20d%3D%22M120%20120H176V392H120ZM336%20120H392V392H336ZM120%20120H176L392%20392H336Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Navotex">
<script>/* fonts are optional and loaded AFTER the app is shown, so a blocked/slow Google Fonts never blocks the screen */addEventListener('load',function(){setTimeout(function(){try{var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap';document.head.appendChild(l)}catch(e){}},1500)})</script>
<style>
:root{
  --pri:#4f46e5;--pri-d:color-mix(in srgb,var(--pri) 82%,#000);--pri-l:color-mix(in srgb,var(--pri) 12%,transparent);
  --bg:#f3f4f8;--card:#fff;--tx:#1b2030;--mut:#6b7280;--bd:#e4e6ee;--inp:#fff;
  --ok:#16a34a;--warn:#d97706;--err:#dc2626;--info:#0284c7;
  --sb:#10131f;--sbtx:#aab2c5;--sbh:rgba(255,255,255,.07);
  --r:12px;--sh:0 1px 2px rgba(16,19,31,.06),0 6px 18px rgba(16,19,31,.06);
  --font:'Inter','Noto Sans Myanmar','Padauk','Myanmar Text',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme=dark]{--bg:#0d1019;--card:#171b29;--tx:#e8ebf5;--mut:#98a1b8;--bd:#272d42;--inp:#101420;--sb:#080a12;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3)}
[data-color=emerald]{--pri:#059669}
[data-color=rose]{--pri:#e11d48}
[data-color=amber]{--pri:#d97706}
[data-color=sky]{--pri:#0284c7}
[data-color=violet]{--pri:#7c3aed}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hide{display:none!important}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:600}.r{text-align:right}.c{text-align:center}
.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.gap{gap:16px}.mt{margin-top:14px}.mb{margin-bottom:14px}
/* inputs */
input,select,textarea{background:var(--inp);border:1px solid var(--bd);border-radius:9px;padding:8px 11px;outline:none;width:100%;min-height:38px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--pri)}
input[type=color]{padding:2px;height:38px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
.fg{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;min-height:38px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--bd))}.btn.danger:hover{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn.lg{min-height:50px;font-size:16px;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{font-size:15px;margin-bottom:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:12px;color:var(--mut);font-weight:500}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
.stat .s{font-size:12px;color:var(--mut)}
.kpi{border-left:4px solid var(--pri)}
/* tables */
.tw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;background:color-mix(in srgb,var(--bg) 60%,var(--card));position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--pri-l)}
td.r,th.r{text-align:right}
td.w{white-space:normal}
tfoot td{font-weight:700;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.empty{padding:36px;text-align:center;color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--pri-l);color:var(--pri)}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.gr{background:var(--bd);color:var(--mut)}
/* tabs / chips */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 16px;border:0;background:none;cursor:pointer;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri)}
.chanbar{align-items:center;padding:6px 12px 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--bd);background:var(--card);padding:5px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
/* layout */
#app{height:100%}
.shell{display:flex;height:100%}
#sb{width:236px;background:var(--sb);color:var(--sbtx);display:flex;flex-direction:column;flex:none;transition:margin .25s,transform .25s;z-index:30}
#sb.collapsed{margin-left:-236px}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;color:#fff;font-weight:700;font-size:16px}
.sb-brand .lg{width:34px;height:34px;border-radius:9px;background:var(--pri);display:grid;place-items:center;overflow:hidden;flex:none}
.sb-brand .lg img{width:100%;height:100%;object-fit:cover}
.sb-brand .lg:has(.dfl),.llogo:has(.dfl){background:#fff!important;box-shadow:none}.dfl{object-fit:contain!important;padding:15%;box-sizing:border-box}
.sb-brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--sbtx);text-decoration:none;margin-bottom:2px;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--sbh);color:#fff}
.nav a.on{background:var(--pri);color:#fff}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.sb-foot .un{flex:1;min-width:0;color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.sb-foot .un small{display:block;color:var(--sbtx);font-weight:400;text-transform:capitalize}
.ib{width:34px;height:34px;border-radius:8px;border:0;background:var(--sbh);color:var(--sbtx);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:12px}
.ib:hover{background:var(--pri);color:#fff}
.mainw{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr{height:60px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 18px;flex:none}
.hdr h2{font-size:17px;white-space:nowrap}
.hdr .clock{position:absolute;left:50%;transform:translateX(-50%);text-align:center;line-height:1.15;pointer-events:none}
.hdr .clock b{font-size:20px;letter-spacing:.5px;display:block}
.hdr .clock span{font-size:11px;color:var(--mut)}
.hdr{position:relative}
.hdr select{width:auto;min-height:34px;padding:4px 10px}
#main{flex:1;overflow:auto;padding:18px}
.menu-btn{display:none}
@media(max-width:1000px){.hdr .clock{display:none}}
@media(max-width:860px){
  #sb{position:fixed;inset:0 auto 0 0;margin-left:0!important;transform:translateX(-100%)}
  #sb.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu-btn{display:grid}
  #main{padding:12px}
}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-h h3{font-size:18px;flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.toolbar .grow{flex:1;min-width:200px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,12,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:100;animation:fi .15s}
.modal{background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:520px;animation:up .18s;margin:auto 0}
.modal.md{max-width:680px}.modal.lg{max-width:920px}.modal.sm{max-width:400px}
.mh{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--bd)}
.mh h3{flex:1;font-size:16px}
.mb2{padding:18px 20px}
.modal.paymodal .mf{justify-content:center}
.mf{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(14px);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--sh);animation:up .2s;max-width:340px;border-left:4px solid var(--info)}
.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--err)}.toast.warn{border-color:var(--warn)}
/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:14px;height:calc(100vh - 96px);min-height:520px}
.pos-l{display:flex;flex-direction:column;gap:10px;min-height:0}
.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;align-content:start;padding:2px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.12s;text-align:left;min-height:112px}
.pc:hover{border-color:var(--pri);transform:translateY(-1px);box-shadow:var(--sh)}
.pc .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.pc .nm{font-weight:600;font-size:13px;line-height:1.25;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .pr{font-weight:700;color:var(--pri)}
.pc .st{font-size:11px;color:var(--mut)}
.pc.out{opacity:.55}
.pc{overflow:hidden}.pc .pi{margin:-12px -12px 2px;height:96px;background:var(--bg)}.pc .pi img{width:100%;height:100%;object-fit:cover;display:block}
.pc .nm{font-size:14px;font-weight:700;-webkit-line-clamp:3}.pc .pi~.nm{-webkit-line-clamp:2}
.pimgbox{width:84px;height:84px;border-radius:12px;background:var(--bg);border:1px dashed var(--bd);display:grid;place-items:center;overflow:hidden;color:var(--mut);flex:none}.pimgbox img{width:100%;height:100%;object-fit:cover}
.pos-r{display:flex;flex-direction:column;padding:0;min-height:0}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.cart{flex:1;overflow:auto;padding:4px 14px}
.cl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.cl .n{font-weight:600}
.cl .q{display:flex;align-items:center;gap:6px}
.cl .q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:700}
.cl .q input{width:56px;text-align:center;min-height:28px;padding:2px}
.cart-t{padding:12px 14px;border-top:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 50%,var(--card))}
.cart-t .tr{display:flex;justify-content:space-between;padding:2px 0}
.cart-t .gt{font-size:24px;font-weight:700;color:var(--pri);padding-top:6px}
.cart-b{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cart-b .pay{grid-column:1/-1}
@media(max-width:980px){.pos{grid-template-columns:1fr;height:auto}.pgrid{max-height:46vh}.pos-r{min-height:420px}}
.paym{display:flex;gap:6px;flex-wrap:wrap}
.pm{padding:7px 12px;border:1px solid var(--bd);border-radius:9px;cursor:pointer;background:var(--card);font-weight:500}
.pm.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.payrow{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.bigchg{font-size:34px;font-weight:700;color:var(--ok);text-align:center;margin:8px 0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* picker */
.pk{position:relative}
.pk-r{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);z-index:50;max-height:260px;overflow:auto;margin-top:4px}
.pk-r div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pk-r div:hover,.pk-r div.hl{background:var(--pri-l)}
/* denom */
.den{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;margin-bottom:6px}
.den input{min-height:32px;padding:3px 8px}
/* barcode labels */
.lab-prev{background:#fff;color:#000;border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;max-height:560px;overflow:auto}
.lab{background:#fff;color:#000;border:1px dashed #bbb;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;line-height:1.2;padding:1mm;font-family:'Myanmar Text','Noto Sans Myanmar','Padauk','Pyidaungsu',Arial,sans-serif}
.lab svg{max-width:100%;display:block}
.lab .ln{font-size:9px;font-weight:700;max-width:100%;line-height:1.75;padding:.3mm 0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;word-break:break-word}
.lab .lp{line-height:1.5}
.lab .lp{font-size:11px;font-weight:800}
.lab .ls{font-size:7px;opacity:.7}
/* chart */
.chart text{fill:var(--mut);font-size:10px;font-family:var(--font)}
.chart .bar{fill:var(--pri)}
.chart .bar:hover{opacity:.75}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .br{display:grid;grid-template-columns:130px 1fr 90px;gap:8px;align-items:center;font-size:13px}
.bars .bt{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--pri);border-radius:6px}
.br span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== v2 visual refresh ===== */
:root{--bg:#f2f4fa;--bd:#e6e9f2;--r:16px;--sh:0 1px 2px rgba(20,24,50,.04),0 8px 24px -8px rgba(20,24,50,.10);--pri-g:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#7c3aed))}
[data-theme=dark]{--bg:#0b0e17;--card:#141926;--bd:#232a3e;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.5)}
body{background:var(--bg)}
/* login */
.login{height:100%;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;background:var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none}
.blob.b1{width:520px;height:520px;background:var(--pri);left:-140px;top:-160px}
.blob.b2{width:440px;height:440px;background:color-mix(in srgb,var(--pri) 50%,#ec4899);right:-120px;bottom:-140px}
.lcard{position:relative;width:100%;max-width:400px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;padding:36px 32px 32px;box-shadow:0 30px 70px -20px rgba(20,24,50,.28);animation:up .3s}
.lcard h1{text-align:center;font-size:26px;letter-spacing:-.4px;margin:0 0 26px}
.llogo{width:84px;height:84px;margin:0 auto 16px;border-radius:24px;background:var(--pri-g);display:grid;place-items:center;overflow:hidden;color:#fff;box-shadow:0 14px 30px -10px var(--pri)}
.llogo img{width:100%;height:100%;object-fit:cover}.llogo .ico{width:42px;height:42px}
.lcard input{min-height:46px;border-radius:12px}
.lcard .btn.lg{margin-top:6px}
.swatches{display:flex;gap:8px;margin-top:16px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);cursor:pointer;box-shadow:0 0 0 1px var(--bd)}
.sw.on{box-shadow:0 0 0 2px var(--tx)}
/* controls */
input,select,textarea{border-radius:11px;min-height:40px;background:var(--inp)}
.btn{border-radius:11px;min-height:40px;font-weight:600;box-shadow:0 1px 1px rgba(20,24,50,.04)}
.btn.pri{background:var(--pri-g);border:0;box-shadow:0 8px 18px -8px var(--pri)}
.btn.pri:hover{filter:brightness(1.07);background:var(--pri-g)}
.btn.ok{box-shadow:0 8px 18px -8px var(--ok)}
.btn.sm{min-height:30px}.btn.lg{min-height:52px}
.card{border-radius:var(--r);border-color:transparent}
[data-theme=dark] .card{border-color:var(--bd)}
.card h3{font-size:15px;font-weight:700}
.badge{padding:3px 10px}
/* sidebar */
#sb{background:linear-gradient(180deg,var(--sb),color-mix(in srgb,var(--sb) 88%,var(--pri)));width:244px}
#sb.collapsed{margin-left:-244px}
.sb-brand{padding:20px 18px}
.sb-brand .lg{width:38px;height:38px;border-radius:11px;background:var(--pri-g);box-shadow:0 8px 18px -6px var(--pri)}
.nav{padding:8px 12px}
.nav a{border-radius:12px;padding:11px 14px;margin-bottom:3px;position:relative;transition:.15s}
.nav a.on{background:var(--pri-g);box-shadow:0 10px 22px -10px var(--pri)}
.sb-foot{margin:10px;border:0;background:rgba(255,255,255,.05);border-radius:14px;padding:10px}
.ib{border-radius:10px;transition:.15s}
.sb-foot{gap:5px}.sb-foot .ib{width:30px;height:30px}.sb-foot .un{font-size:12px;overflow:hidden;text-overflow:ellipsis}
/* header */
.hdr{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hdr .hb{background:var(--bg);color:var(--tx)}.hdr .hb:hover,.hdr .hb.on{background:var(--pri);color:#fff}
.hdr .clock b{font-size:21px;font-weight:700}
.hdr select{border-radius:10px;background:var(--bg)}
#main{padding:22px}
.page-h h3{font-size:20px;font-weight:700;letter-spacing:-.2px}
/* kpi */
.kpi{display:flex;gap:14px;align-items:center;border-left:0;padding:18px}
.kpi .kic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.kpi .kic .ico{width:22px;height:22px}
.kpi.c1 .kic{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.kpi.c2 .kic{background:linear-gradient(135deg,#10b981,#059669)}
.kpi.c3 .kic{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
.kpi.c4 .kic{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.stat .v{font-size:24px}
/* tables */
.tw{border-radius:var(--r);border-color:var(--bd)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:11px 14px}
td{padding:11px 14px}
.tabs{border-bottom:0;background:var(--card);padding:5px;border-radius:14px;display:inline-flex;max-width:100%;box-shadow:var(--sh)}
.tab{border-radius:10px;border-bottom:0;padding:8px 16px}
.tab.on{background:var(--pri-g);color:#fff}
.chip{padding:6px 15px;font-weight:500}
.chip.on{background:var(--pri-g);border-color:transparent;box-shadow:0 6px 14px -6px var(--pri)}
/* POS */
.pos{grid-template-columns:1fr 410px}
.pc{border-radius:16px;border-color:transparent;box-shadow:var(--sh);padding:12px;min-height:124px}
[data-theme=dark] .pc{border-color:var(--bd)}
.pc:hover{transform:translateY(-3px);box-shadow:0 14px 28px -12px var(--pri);border-color:var(--pri)}
.pc:active{transform:scale(.97)}
.pc .av{width:42px;height:42px;border-radius:13px}
.pc .pr{display:inline-block;background:var(--pri-l);padding:2px 9px;border-radius:99px;align-self:flex-start;font-size:13px}
.pos-r{border-radius:20px;overflow:hidden}
.cart-t{background:var(--pri-l)}
.cart-t .gt{font-size:28px}
.cart-b .pay{min-height:56px;font-size:18px;border-radius:14px}
.cl .q button{border-radius:9px}
/* modal / toast */
.modal{border-radius:20px}
.mbg{backdrop-filter:blur(3px)}
.toast{border-radius:12px;background:#151a2c}
.bars .bt{height:9px}
@media(max-width:980px){.pos{grid-template-columns:1fr}}
html.single-br #brSel,html.single-br #dsc,html.single-br #sb2,html.single-br #rb{display:none!important}
/* shutdown */
.shut{position:fixed;right:20px;bottom:20px;z-index:5;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(8px);color:var(--mut);padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600;transition:.15s}
.shut:hover{background:var(--err);border-color:var(--err);color:#fff}
.closed{height:100%;display:grid;place-items:center;text-align:center;padding:20px}
.closed .ico{width:54px;height:54px;color:var(--mut);margin-bottom:10px}
@media(max-width:600px){.pos{display:block}.pos-l,.pos-r{min-width:0;width:100%}.pos-r{margin-top:14px}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.cart-h{flex-wrap:wrap}#main{padding:14px 12px}.page-h h3{font-size:18px}.tabs{overflow-x:auto}}
#lock{position:fixed;inset:0;z-index:90;background:rgba(15,18,32,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;overflow:auto}
#lock .lcard{animation:up .25s}
@media(min-width:861px){
#sb{transition:width .25s}
#sb.collapsed{margin-left:0;width:76px}
#sb.collapsed .sb-brand{justify-content:center;padding:18px 0}
#sb.collapsed .sb-brand span,#sb.collapsed .nav a span,#sb.collapsed .sb-foot .un{display:none}
#sb.collapsed .nav{padding:8px 10px}
#sb.collapsed .nav a{justify-content:center;padding:12px 0}
#sb.collapsed .sb-foot .ib{width:40px;height:34px;font-size:12px;white-space:nowrap}
#sb.collapsed .sb-foot{flex-direction:column;margin:8px;padding:8px 4px;align-items:center}
}
#scrLock{position:fixed;inset:0;z-index:95;cursor:not-allowed}
#scrLock:has(.lk-pad:not(.hide)){background:rgba(10,12,24,.28);cursor:default}
.lk-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#151a2c;color:#fff;border:0;padding:10px 22px;border-radius:99px;box-shadow:0 14px 34px -10px rgba(0,0,0,.55);cursor:pointer;font:inherit;white-space:nowrap}
.lk-bar .ico{width:18px;height:18px}.lk-bar span{opacity:.65;font-size:12px}
.lk-pad{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:292px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:18px;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.55);cursor:default}
.lk-u{font-weight:700}.lk-u .ico{width:15px;height:15px;vertical-align:-2px}
.lk-dots{display:flex;gap:14px;justify-content:center;margin:14px 0 8px}.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}.lk-dots i.on{background:var(--pri)}
.lk-msg{font-size:12px;color:var(--mut);min-height:18px}
.lk-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lk-keys button{height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;font-weight:600;cursor:pointer}
.lk-keys button:active{background:var(--pri);color:#fff}
.lk-pad.shake{animation:lkshake .3s}@keyframes lkshake{20%{transform:translateX(calc(-50% - 8px))}50%{transform:translateX(calc(-50% + 8px))}80%{transform:translateX(calc(-50% - 4px))}}

/* ===== Navotex v3 — square, folded-corner UI ===== */
:root{--f:14px;--fs:8px;--r:0px;--fold:color-mix(in srgb,var(--card) 82%,#000);
  --sh:none;--ink:#0f1222;
  --cut:polygon(0 0,100% 0,100% calc(100% - var(--f)),calc(100% - var(--f)) 100%,0 100%)}
[data-theme=dark]{--fold:color-mix(in srgb,var(--card) 70%,#000)}
*{border-radius:0!important}
.sw,.blob,.lk-dots i{border-radius:50%!important}
body{letter-spacing:.005em}
/* folded corner: flap (background) + 45deg cut (clip-path) */
.card,.modal,.tw,.pc,.rcsec,.lcard,.pos-r,.toast,.lk-pad,.tabs,.sb-foot,.pk-r{
  clip-path:var(--cut);
  background-image:linear-gradient(315deg,transparent 50%,var(--fold) 50%);
  background-repeat:no-repeat;background-position:100% 100%;background-size:var(--f) var(--f)}
.modal{--f:26px}.lcard{--f:30px}.pos-r{--f:22px}.card,.tw,.rcsec{--f:16px}.toast,.pk-r,.sb-foot,.tabs{--f:10px}
.btn,.chip,.pm,.ib,.hdr .hb{clip-path:polygon(0 0,100% 0,100% calc(100% - var(--fs)),calc(100% - var(--fs)) 100%,0 100%);
  background-image:linear-gradient(315deg,transparent 50%,color-mix(in srgb,currentColor 22%,transparent) 50%);background-repeat:no-repeat;background-position:100% 100%;background-size:var(--fs) var(--fs)}
.btn.lg,.cart-b .pay{--fs:12px}
.btn.sm{--fs:6px}
.btn.pri{background-image:linear-gradient(315deg,transparent 50%,rgba(0,0,0,.28) 50%)}
.btn.pri,.nav a.on,.sb-brand .lg,.llogo{background-color:var(--pri)!important}
.btn.pri,.btn.ok{box-shadow:none}
.btn.pri{background-image:linear-gradient(315deg,transparent 50%,rgba(0,0,0,.28) 50%)!important}
.btn.ok{background-image:linear-gradient(315deg,transparent 50%,rgba(0,0,0,.28) 50%)}
/* flat, crisp surfaces */
.card,.pc,.tabs,.tw{box-shadow:none!important;border:1px solid var(--bd)}
.card:hover,.pc:hover{border-color:color-mix(in srgb,var(--pri) 55%,var(--bd))}
.card.kpi,.kpi.stat{border-top:3px solid var(--pri)}
.modal{border:1px solid var(--bd);box-shadow:none}
.lcard{backdrop-filter:none;background-color:var(--card)}
input,select,textarea{border-width:1px;border-color:color-mix(in srgb,var(--tx) 18%,var(--bd))}
input:focus,select:focus,textarea:focus{box-shadow:none;border-color:var(--pri);outline:2px solid var(--pri-l);outline-offset:0}
.badge{padding:2px 9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:10px}
/* tables */
thead th{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700}
/* sidebar */
.nav a{border-radius:0;position:relative}
.nav a.on{box-shadow:none}
.nav a.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#fff}
.nav a{padding-left:16px}
.tab.on,.tab.active{box-shadow:inset 0 -3px 0 var(--pri)}
.llogo{box-shadow:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.sb-brand .lg{box-shadow:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.lk-bar{clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.lwrap{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}.lwrap .lcard{max-width:none}.ltag{text-align:center;font-size:19px;font-weight:700;letter-spacing:.25em;padding-left:.25em;white-space:nowrap;color:var(--tx);margin-bottom:18px;width:100%}
.nvx-by{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);font-weight:700}

.chip.on,.pm.on,.hdr .hb.on{background-color:var(--pri)!important}
@media print{*{clip-path:none!important;background-image:none!important}}

}

  try{
    const clr=COLORS[PREFS.color]||'#4f46e5',lg=DB&&DB.settings&&DB.settings.logo;

function applyPrefs(){const h=document.documentElement;h.dataset.theme=PREFS.mode;h.dataset.color=PREFS.color;h.lang=PREFS.lang==='my'?'my':'en';try{localStorage.setItem(PKEY,JSON.stringify(PREFS))}catch(e){}setAppIcon()}


/* ---------- auto backup ---------- */
const AB_DAYS={daily:1,weekly:7,monthly:30},FSA=typeof window.showDirectoryPicker==='function';
let abPending=false,abBusy=false;
function idb(){return new Promise((res,rej)=>{let done=false;const fin=(f,v)=>{if(!done){done=true;clearTimeout(tm);f(v)}},tm=setTimeout(()=>fin(rej,new Error('indexedDB timeout')),2500);try{const r=indexedDB.open('store-pos-handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>fin(res,r.result);r.onerror=()=>fin(rej,r.error);r.onblocked=()=>fin(rej,new Error('blocked'))}catch(e){fin(rej,e)}})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('h').objectStore('h').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('h','readwrite');v==null?tx.objectStore('h').delete(k):tx.objectStore('h').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function abNextDue(){const ab=PREFS.ab;if(ab.freq==='off')return null;return ab.last?new Date(new Date(ab.last).getTime()+AB_DAYS[ab.freq]*864e5):new Date(0)}
function abFileName(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `navotex-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`}
function abChip(){const b=$('#abChip');if(b)b.classList.toggle('hide',!abPending)}
async function abRun(interactive){
  if(abBusy)return false;abBusy=true;const ab=PREFS.ab,name=abFileName();
  try{
    const data=JSON.stringify(DB);
    if(ab.mode==='folder'){
      const h=await idbGet('dir');if(!h)throw new Error(t('Backup folder is not set'));
      let perm=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';
      if(perm!=='granted'){
        if(!interactive){abPending=true;abChip();return false}
        perm=await h.requestPermission({mode:'readwrite'});if(perm!=='granted')throw new Error(t('Folder permission was not granted'));
      }
      const w=await(await h.getFileHandle(name,{create:true})).createWritable();await w.write(data);await w.close();
      const files=[];for await(const [n] of h.entries())if(/^(?:navotex|store-pos)-backup-.*\.json$/.test(n))files.push(n);
      files.sort().reverse();for(const n of files.slice(ab.keep||12))try{await h.removeEntry(n)}catch(e){}
    }else if(ab.mode==='gdrive'){
      try{await gdBackup(name,data,interactive)}catch(e){if(!interactive){abPending=true;abChip();ab.status='fail';ab.msg=e.message;applyPrefs();return false}throw e}
    }else download(name,data,'application/json',false);
    ab.last=new Date().toISOString();ab.status='ok';ab.msg=name;abPending=false;applyPrefs();abChip();
    toast(t('Backup saved: {n}',{n:name}),'ok');return true;
  }catch(e){
    ab.status='fail';ab.msg=e.message||String(e);applyPrefs();if(interactive)toast(t('Backup failed: {n}',{n:ab.msg}),'err');return false;
  }finally{abBusy=false;if(S.route==='settings'&&S.set&&S.set.tab==='data'&&$('#abBox'))abBoxRender()}
}
async function abCheck(){
  const n=abNextDue();if(!S.user||!n||n>new Date()){if(!n||n>new Date()){abPending=false;abChip()}return}
  await abRun(false);
}

/* ---------- PWA: offline + install + update notice (only when served over http/https) ---------- */
let pwaPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pwaPrompt=e;try{if(S.route==='settings'&&S.set&&S.set.tab==='license')licSettings()}catch(x){}});
window.addEventListener('appinstalled',()=>{pwaPrompt=null});
window.__pwaInstall=async()=>{if(!pwaPrompt)return toast(t('Use the browser menu → Install app / Add to Home Screen'),'warn');pwaPrompt.prompt();try{await pwaPrompt.userChoice}catch(e){}pwaPrompt=null;if(S.route==='settings')licSettings()};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.register('sw.js').then(reg=>{setInterval(()=>reg.update().catch(()=>{}),60*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had||reloading)return;reloading=true;
    const d=document.createElement('div');d.className='toast ok';d.style.cursor='pointer';d.textContent='🔄 '+t('A new version is ready — tap here to reload');d.onclick=()=>location.reload();$('#toasts').appendChild(d);

function picker(input,onPick,filter){
  input.parentElement.classList.add('pk');
  const res=document.createElement('div');res.className='pk-r hide';input.parentElement.appendChild(res);
  let list=[],hl=0;
  const mark=()=>$$('div',res).forEach((d,i)=>d.classList.toggle('hl',i===hl));
  function show(){
    const q=input.value.trim().toLowerCase();if(!q){res.classList.add('hide');return}
    list=DB.products.filter(p=>p.active!==false&&(!filter||filter(p))&&(p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.barcode||'').includes(q))).slice(0,8);hl=0;
    res.innerHTML=list.map((p,i)=>`<div data-i="${i}" class="${i===0?'hl':''}"><span>${esc(p.name)} <span class="mut sm">${esc(p.sku||'')}</span></span><span class="mut sm">${money(p.price)}</span></div>`).join('')||`<div class="mut">${t('No results')}</div>`;
    res.classList.remove('hide');
  }
  function pick(p){input.value='';res.classList.add('hide');onPick(p);input.focus()}
  input.addEventListener('input',show);
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const q=input.value.trim();const ex=q&&DB.products.find(p=>p.barcode===q||p.sku===q);const p=ex||list[hl];if(p)pick(p)}
    else if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(hl+1,list.length-1);mark()}
    else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(hl-1,0);mark()}
    else if(e.key==='Escape'){res.classList.add('hide')}
  });
  res.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(list[+d.dataset.i])}});
  input.addEventListener('blur',()=>setTimeout(()=>res.classList.add('hide'),150));
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

const C128=('212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112').split(',');
function code128(text){
  const vals=[];
  if(/^\d{4,}$/.test(text)&&text.length%2===0){vals.push(105);for(let i=0;i<text.length;i+=2)vals.push(+text.slice(i,i+2))}
  else{vals.push(104);for(const ch of text){const c=ch.charCodeAt(0);if(c<32||c>126)throw new Error('ascii');vals.push(c-32)}}
  let s=vals[0];for(let i=1;i<vals.length;i++)s+=vals[i]*i;
  vals.push(s%103,106);
  return vals.map(v=>C128[v]).join('');
}
const EL='0001101,0011001,0010011,0111101,0100011,0110001,0101111,0111011,0110111,0001011'.split(',');
const EG='0100111,0110011,0011011,0100001,0011101,0111001,0000101,0010001,0001001,0010111'.split(',');
const ER='1110010,1100110,1101100,1000010,1011100,1001110,1010000,1000100,1001000,1110100'.split(',');
const EP='LLLLLL,LLGLGG,LLGGLG,LLGGGL,LGLLGG,LGGLLG,LGGGLL,LGLGLG,LGLGGL,LGGLGL'.split(',');
const eanCheck=d=>{let s=0;for(let i=0;i<12;i++)s+=(+d[i])*(i%2?3:1);return (10-s%10)%10};
const validEAN=c=>/^\d{13}$/.test(c)&&eanCheck(c)===+c[12];
const eanCheck8=d=>{let s=0;for(let i=0;i<7;i++)s+=(+d[i])*(i%2?1:3);return (10-s%10)%10};
const validEAN8=c=>/^\d{8}$/.test(c)&&eanCheck8(c)===+c[7];
function ean8(code){
  let b='101';for(let i=0;i<4;i++)b+=EL[+code[i]];
  b+='01010';for(let i=4;i<8;i++)b+=ER[+code[i]];b+='101';
  let w='',run=1;for(let i=1;i<b.length;i++){if(b[i]===b[i-1])run++;else{w+=run;run=1}}w+=run;return w;
}
function ean13(code){
  const par=EP[+code[0]];let b='101';
  for(let i=1;i<=6;i++)b+=(par[i-1]==='L'?EL:EG)[+code[i]];
  b+='01010';for(let i=7;i<=12;i++)b+=ER[+code[i]];
  b+='101';
  // bit string -> run-length widths (starts with a bar)
  let w='',run=1;for(let i=1;i<b.length;i++){if(b[i]===b[i-1])run++;else{w+=run;run=1}}w+=run;return w;
}
function genEAN(){
  // 8-digit EAN-8: '2' + 6-digit running number + check digit
  let c;do{DB.counters.ean8=(DB.counters.ean8||0)+1;const base='2'+String(DB.counters.ean8).padStart(6,'0');c=base+eanCheck8(base)}while(DB.products.some(p=>p.barcode===c));
  return c;
}
function barSVG(widths,text,{h=50,q=10,txt=true}={}){
  let x=q,r='',bar=true;for(const ch of widths){const w=+ch;if(bar)r+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w;bar=!bar}
  const W=x+q;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h+(txt?12:0)}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges"><g fill="#000">${r}</g>${txt?`<text x="${W/2}" y="${h+10}" text-anchor="middle" font-size="9" font-family="monospace" fill="#000">${esc(text)}</text>`:''}</svg>`;
}
function barcodeSVG(code,type='auto',o={}){
  code=String(code||'').trim();if(!code)return '';
  try{
    if(type==='ean8'||(type==='auto'&&validEAN8(code))){
      if(!validEAN8(code))throw new Error('ean8');
      return barSVG(ean8(code),code,{...o,q:9});
    }
    if(type==='ean13'||(type==='auto'&&validEAN(code))){
      if(!validEAN(code))throw new Error('ean');
      return barSVG(ean13(code),code,{...o,q:9});
    }
    return barSVG(code128(code),code,o);
  }catch(e){return `<div class="err sm">${t(e.message==='ean8'?'Invalid EAN-8 (8 digits + valid check digit)':e.message==='ean'?'Invalid EAN-13 (13 digits + valid check digit)':'Code128 supports ASCII characters only')}</div>`}
}

function calcCart(cart){
  const sub=rnd(sum(cart.lines,l=>l.qty*l.price));
  const dv=num(cart.discount&&cart.discount.value);
  let disc=cart.discount&&cart.discount.type==='pct'?sub*dv/100:dv;disc=Math.min(rnd(disc),sub);
  const base=sub-disc,mode=DB.settings.taxMode,rate=num(DB.settings.taxRate)/100;
  let tax=0,total=base;
  if(mode==='exclusive'){tax=rnd(base*rate);total=base+tax}else if(mode==='inclusive'){tax=rnd(base-base/(1+rate))}
  return {sub,disc,tax,total:rnd(total)};
}

function barChart(data,{h=180,fmt=n=>nf(n)}={}){
  const W=Math.max(320,data.length*52),max=Math.max(1,...data.map(d=>d.value)),bw=Math.min(34,W/data.length-14),top=18,bot=22;
  const bars=data.map((d,i)=>{const x=i*(W/data.length)+(W/data.length-bw)/2,bh=Math.max(d.value>0?2:0,(h-top-bot)*d.value/max),y=h-bot-bh;
    return `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4"><title>${esc(d.label)}: ${esc(fmt(d.value))}</title></rect><text x="${x+bw/2}" y="${h-7}" text-anchor="middle">${esc(d.label)}</text>${d.value>0?`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle">${esc(d.short||fmt(d.value))}</text>`:''}`}).join('');

}

VIEWS.dashboard=function(){
  const sc=S.dash.branch,td=dkey(),bs=myBranches().map(b=>b.id);
  const okBr=b=>inScope(b,sc)&&bs.includes(b);
  const sales=DB.sales.filter(s=>s.status==='completed'&&okBr(s.branchId));
  const today=sales.filter(s=>dkey(s.date)===td);
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});
  const chart=days.map(d=>{const k=dkey(d),v=sum(sales.filter(s=>dkey(s.date)===k),s=>s.total);return {label:pad(d.getDate())+'/'+pad(d.getMonth()+1),value:v,short:cur()!=='MMK'?curSym()+Math.round(v):(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1000?Math.round(v/1000)+'k':String(Math.round(v)))}});
  const wk=sales.filter(s=>dkey(s.date)>=dkey(days[0]));
  const tp={};wk.forEach(s=>s.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty*i.price));
  const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({l,v}));
  const low=[];DB.branches.filter(b=>okBr(b.id)).forEach(b=>DB.products.forEach(p=>{if(lowStock(p,b.id))low.push({p,b})}));
  low.sort((a,b)=>stockOf(a.p,a.b.id)-stockOf(b.p,b.b.id));
  const openSh=DB.shifts.filter(s=>s.status==='open'&&okBr(s.branchId));
  const recent=[...sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  main().innerHTML=`<div class="page-h"><h3>${t('Overview')}</h3>
    <select id="dsc" style="width:auto"><option value="all">${t('All branches')}</option>${myBranches().map(b=>`<option value="${b.id}" ${sc===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
  <div class="grid4 mb">
    ${kpi('coins','c1',t("Today's sales"),money(sum(today,s=>s.total)),today.length+' '+t('orders'))}
    ${kpi('trend','c2',t('Gross profit today'),money(sum(today,saleProfit)),t('after discount, excl. tax'))}
    ${kpi('sales','c3',t('Last 7 days'),money(sum(wk,s=>s.total)),wk.length+' '+t('orders'))}
    ${kpi('alert','c4',t('Low stock items'),String(low.length),openSh.length+' '+t('open shift(s)'),low.length?'warn':'')}</div>
  <div class="grid2 mb" style="grid-template-columns:1.4fr 1fr">
    <div class="card"><h3>${t('Sales — last 7 days')}</h3>${barChart(chart,{fmt:money})}</div>
    <div class="card"><h3>${t('Top products (7 days)')}</h3>${hbars(top)}</div></div>
  <div class="grid2" style="grid-template-columns:1fr 1fr">
    <div class="card"><h3>${t('Low stock')}</h3>${low.length?`<div class="tw"><table><thead><tr><th>${t('Product')}</th><th>${t('Branch')}</th><th class="r">${t('Stock')}</th><th class="r">${t('Min')}</th></tr></thead><tbody>${low.slice(0,8).map(x=>`<tr><td>${esc(x.p.name)}</td><td>${esc(x.b.name)}</td><td class="r ${stockOf(x.p,x.b.id)<=0?'err':'warn'} b">${nf(stockOf(x.p,x.b.id))}</td><td class="r">${nf(x.p.minStock)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('All stock levels are fine')}</div>`}</div>
    <div class="card"><h3>${t('Recent sales')}</h3>${recent.length?`<div class="tw"><table><tbody>${recent.map(s=>`<tr><td>${esc(s.no)}</td><td class="mut">${fdt(s.date)}</td><td class="r b">${money(s.total)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('No sales yet')}</div>`}</div></div>`;
  $('#dsc').onchange=e=>{S.dash.branch=e.target.value;VIEWS.dashboard()};
  stripBranchCols(main());
};

const getCart=()=>S.carts[S.branchId]||(S.carts[S.branchId]={lines:[],mode:'retail',customerId:null,discount:{type:'amt',value:0},channel:(S.lastChan&&chans().includes(S.lastChan))?S.lastChan:chans()[0]});
S.posCat='';
VIEWS.pos=function(){
  main().innerHTML=`<div class="pos"><section class="pos-l">
    <div class="row"><div class="sp" style="position:relative"><input id="posQ" placeholder="${t('Scan barcode or search product…')}  (F2)" autocomplete="off" style="padding-left:36px"><span style="position:absolute;left:11px;top:9px;color:var(--mut)">${ic('search')}</span></div></div>
    <div id="posCats" class="chips"></div><div id="posGrid" class="pgrid"></div></section>
    <section class="pos-r card"><div class="cart-h"><b class="sp">${t('Current sale')}</b>
      ${shiftMode()==='off'?'':`<button class="btn sm" data-act="cashOutPos" title="${t('Cash out')}">${ic('coins')} ${t('Cash out')}</button>`}
      <button class="btn sm" data-act="heldList">${ic('pause')} ${t('Held')} <span id="heldN" class="badge"></span></button>
      <button class="btn sm danger" data-act="clearCart">${ic('trash')}</button></div>
      <div id="custBar" class="chips chanbar"></div><div id="chanBar" class="chips chanbar"></div><div id="cart" class="cart"></div><div id="cartTot" class="cart-t"></div>
      <div class="cart-b"><button class="btn" data-act="discount">${t('Discount')}</button><button class="btn" data-act="hold">${ic('pause')} ${t('Hold')}</button>
      <button class="btn ok lg pay" data-act="pay">${t('Pay')} (F9)</button></div></section></div>`;
  const q=$('#posQ');q.focus();
  q.addEventListener('input',posGrid);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scanEnter(q.value.trim())}});
  $('#cart').addEventListener('change',e=>{const i=e.target.dataset.ci;if(i!=null)setQty(+i,num(e.target.value))});
  // Enter in a quantity box confirms it and returns to the search / scan box
  $('#cart').addEventListener('keydown',e=>{
    const inp=e.target;if(inp.dataset.ci==null)return;
    if(e.key==='Enter'){e.preventDefault();const q=$('#posQ');q&&q.focus();return} // moving focus fires 'change', which commits the quantity
    // barcode-scanner guard: very fast key bursts typed into a qty box are a scan, not a quantity
    if(e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
      const t0=performance.now(),b=inp._burst=(inp._burst&&t0-inp._last<60)?inp._burst:[];inp._last=t0;b.push(e.key);
      if(b.length>=3){e.preventDefault();inp.value=inp._orig!=null?inp._orig:inp.defaultValue;const q=$('#posQ');q.value=b.join('');inp._burst=null;q.focus();q.setSelectionRange(q.value.length,q.value.length)}
    }
  });
  posCats();posGrid();renderCart();
};
function posCats(){
  const used=new Set(DB.products.filter(p=>p.active!==false).map(p=>p.categoryId));
  $('#posCats').innerHTML=`<span class="chip ${!S.posCat?'on':''}" data-act="pcat" data-c="">${t('All')}</span>`+DB.categories.filter(c=>used.has(c.id)).map(c=>`<span class="chip ${S.posCat===c.id?'on':''}" data-act="pcat" data-c="${c.id}">${esc(c.name)}</span>`).join('');
}
ACT.pcat=el=>{S.posCat=el.dataset.c;posCats();posGrid()};
function posFiltered(){
  const q=($('#posQ')||{value:''}).value.trim().toLowerCase();
  return DB.products.filter(p=>p.active!==false&&(!S.posCat||p.categoryId===S.posCat)&&(!q||p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.barcode||'').includes(q)));
}
function posGrid(){
  const L=posFiltered().slice(0,150),neg=DB.settings.allowNegative;
  $('#posGrid').innerHTML=L.map(p=>{const s=stockOf(p),tr=p.trackStock!==false,out=tr&&s<=0&&!neg;
    return `<button class="pc ${out?'out':''}" data-act="padd" data-id="${p.id}">${DB.settings.posImg!==false&&p.img?`<div class="pi"><img src="${p.img}" alt="" loading="lazy"></div>`:''}<div class="nm">${esc(p.name)}</div><div class="pr">${money(priceOf(p,getCart().mode))}</div><div class="st">${tr?(s<=0?`<span class="err">${t('Out of stock')}</span>`:nf(s)+' '+esc(p.unit||'')):'&nbsp;'}</div></button>`}).join('')||`<div class="empty" style="grid-column:1/-1">${t('No products found')}</div>`;
}
ACT.padd=el=>addToCart(prod(el.dataset.id));
function scanEnter(v){
  if(!v)return;
  const ex=DB.products.find(p=>p.active!==false&&(p.barcode===v||p.sku===v));
  const f=ex?[ex]:posFiltered();
  if(f.length===1){addToCart(f[0]);$('#posQ').value='';posGrid();beep()}
  else if(!f.length){toast(t('Product not found: {v}',{v}),'err')}
}
function addToCart(p,qty=1){
  if(!p)return;const cart=getCart();let l=cart.lines.find(x=>x.pid===p.id);
  const want=(l?l.qty:0)+qty;
  if(p.trackStock!==false&&!DB.settings.allowNegative&&want>stockOf(p)){return toast(t('Not enough stock: {n} available',{n:nf(stockOf(p))}),'err')}
  if(l)l.qty=want;else cart.lines.push({pid:p.id,name:p.name,unit:p.unit,price:priceOf(p,cart.mode),cost:p.cost,qty});
  renderCart();
  focusQty(p.id);
}
function focusQty(pid){
  const i=getCart().lines.findIndex(x=>x.pid===pid),inp=i<0?null:$(`#cart [data-ci="${i}"]`);
  if(inp){inp.focus();inp.select();inp._orig=inp.value}else{const q=$('#posQ');if(q&&document.activeElement!==q)q.focus()}
}
function setQty(i,v){
  const cart=getCart(),l=cart.lines[i];if(!l)return;
  if(v<=0){cart.lines.splice(i,1)}
  else{const p=prod(l.pid);if(p&&p.trackStock!==false&&!DB.settings.allowNegative&&v>stockOf(p)){toast(t('Not enough stock: {n} available',{n:nf(stockOf(p))}),'err');v=stockOf(p)}l.qty=v}
  renderCart();
}
ACT.cq=el=>{const l=getCart().lines[+el.dataset.i];if(l)setQty(+el.dataset.i,l.qty+ +el.dataset.d)};
ACT.crm=el=>{getCart().lines.splice(+el.dataset.i,1);renderCart()};
ACT.setPmode=el=>{const c=getCart();c.mode=el.dataset.m;c.lines.forEach(l=>{const p=prod(l.pid);if(p)l.price=priceOf(p,c.mode)});renderCart();posGrid();const q=$('#posQ');q&&q.focus()};
ACT.custQuick=()=>custModal(null,x=>{getCart().customerId=x.id;renderCart()});
ACT.setChan=el=>{const c=getCart();c.channel=el.dataset.c;S.lastChan=c.channel;renderCart();const q=$('#posQ');q&&q.focus()};
ACT.clearCart=async()=>{const c=getCart();if(!c.lines.length)return;if(await confirmBox(t('Clear the current sale?'),{danger:true})){S.carts[S.branchId]=null;getCart();renderCart()}};
function renderCart(){
  const cart=getCart(),c=calcCart(cart),el=$('#cart');if(!el)return;
  el.innerHTML=cart.lines.map((l,i)=>`<div class="cl"><div class="n">${esc(l.name)}</div><div class="b r">${money(l.qty*l.price)}</div>
    <div class="q"><button data-act="cq" data-i="${i}" data-d="-1">−</button><input type="number" step="any" min="0" value="${l.qty}" data-ci="${i}"><button data-act="cq" data-i="${i}" data-d="1">+</button><span class="mut sm">× ${money(l.price)}</span></div>
    <div class="r"><button class="btn ghost sm danger" data-act="crm" data-i="${i}" aria-label="remove">${ic('trash')}</button></div></div>`).join('')||`<div class="empty">${t('Cart is empty — scan or tap a product')}</div>`;
  const kb=$('#custBar');if(kb){kb.classList.toggle('hide',!wholesaleOn());
    kb.innerHTML=wholesaleOn()?`<button class="chip ${cart.mode!=='wholesale'?'on':''}" data-act="setPmode" data-m="retail">${t('Retail')}</button><button class="chip ${cart.mode==='wholesale'?'on':''}" data-act="setPmode" data-m="wholesale">${t('Wholesale')}</button>
      <select id="custSel" style="max-width:170px;padding:4px 8px"><option value="">${t('— Customer —')}</option>${DB.customers.map(x=>`<option value="${x.id}" ${cart.customerId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn sm" data-act="custQuick" title="${t('Add customer')}">+</button>`:'';
    const cs=$('#custSel');if(cs)cs.onchange=e=>{cart.customerId=e.target.value||null}}
  const cbar=$('#chanBar');if(cbar){const cc=chans();if(!cc.includes(cart.channel))cart.channel=cc[0];cbar.classList.toggle('hide',cc.length<2);cbar.innerHTML=cc.length<2?'':`<span class="mut sm">${t('Channel')}</span>`+cc.map(x=>`<button class="chip ${cart.channel===x?'on':''}" data-act="setChan" data-c="${esc(x)}">${esc(CHN(x))}</button>`).join('')}
  const st=DB.settings;
  $('#cartTot').innerHTML=`${c.disc?`<div class="tr"><span>${t('Discount')}${cart.discount.type==='pct'?' ('+cart.discount.value+'%)':''}</span><span class="err">−${money(c.disc)}</span></div>`:''}
    ${st.taxMode!=='none'?`<div class="tr"><span>${t('Tax')} ${st.taxRate}% ${st.taxMode==='inclusive'?'('+t('incl.')+')':''}</span><span>${money(c.tax)}</span></div>`:''}
    <div class="tr gt"><span>${t('Total')}</span><span>${money(c.total)}</span></div>
    ${(q=>q.length?`<div class="tr mut sm"><span></span><span>≈ ${q.map(c=>fxFmt(c,c.total/c.rate)).join(' · ')}</span></div>`:'')(fxList().filter(x=>x.rate>0).map(x=>({...x,total:c.total})))}`;
  {const pos=$('.pos');if(pos){let fab=$('#cartFab');if(!fab){fab=document.createElement('button');fab.id='cartFab';fab.className='cart-fab';fab.dataset.act='cartToggle';pos.appendChild(fab)}
    const n=cart.lines.reduce((a,l)=>a+(+l.qty||0),0);fab.classList.toggle('hide',!cart.lines.length);fab.innerHTML=`<span>🛒 ${t('Cart')} (${rnd(n)})</span><span>${money(c.total)}</span>`;if(!cart.lines.length)pos.classList.remove('cartopen');
    const ch=$('.cart-h');if(ch&&!$('.cart-x',ch)){const x=document.createElement('button');x.className='btn sm cart-x';x.dataset.act='cartToggle';x.textContent='✕';ch.insertBefore(x,ch.firstChild)}}}
  const hn=$('#heldN');if(hn){const n=DB.held.filter(h=>h.branchId===S.branchId).length;hn.textContent=n;hn.classList.toggle('hide',!n)}
}
ACT.cartToggle=()=>{const p=$('.pos');if(p)p.classList.toggle('cartopen')};
ACT.discount=()=>{
  const cart=getCart();if(!cart.lines.length)return;
  const d=cart.discount||{type:'amt',value:0};
  const m=modal(t('Discount'),fld(t('Type'),`<select name="type">${opts([['amt',t('Amount')],['pct',t('Percent %')]],d.type)}</select>`)+fld(t('Value'),`<input name="value" type="number" step="any" min="0" value="${d.value||''}">`),`<button class="btn" data-close>${t('Cancel')}</button><button class="btn pri" id="dOk">${t('Apply')}</button>`,'sm');
  $('#dOk',m).onclick=()=>{const f=getForm(m);let v=num(f.value);if(f.type==='pct')v=Math.min(v,100);cart.discount={type:f.type,value:v};closeM(m);renderCart()};
};
ACT.hold=()=>{const cart=getCart();if(!cart.lines.length)return;
  DB.held.push({id:uid(),branchId:S.branchId,userId:S.user.id,date:now(),cart:JSON.parse(JSON.stringify(cart))});
  S.carts[S.branchId]=null;getCart();save();renderCart();toast(t('Sale put on hold'),'ok')};
ACT.heldList=()=>{
  const L=DB.held.filter(h=>h.branchId===S.branchId);
  const m=modal(t('Held sales'),L.length?`<div class="tw"><table><tbody>${L.map(h=>`<tr><td>${fdt(h.date)}</td><td>${h.cart.lines.length} ${t('items')}</td><td class="r b">${money(calcCart(h.cart).total)}</td><td class="r"><button class="btn sm pri" data-act="heldGo" data-id="${h.id}">${t('Resume')}</button> <button class="btn sm danger" data-act="heldDel" data-id="${h.id}">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('No held sales')}</div>`,'','md');
  m.id='heldM';
};
ACT.heldGo=el=>{
  if(getCart().lines.length)return toast(t('Hold or clear the current sale first'),'warn');
  const i=DB.held.findIndex(h=>h.id===el.dataset.id);if(i<0)return;
  S.carts[S.branchId]=DB.held[i].cart;DB.held.splice(i,1);save();closeM(el);renderCart();
};
ACT.heldDel=async el=>{if(!await confirmBox(t('Delete this held sale?'),{danger:true}))return;DB.held=DB.held.filter(h=>h.id!==el.dataset.id);save();const m=el.closest('.mbg');m.remove();renderCart();ACT.heldList()};

/* ----- shift open ----- */
function openShiftModal(after){
  const m=modal(t('Open shift'),`<p class="mut">${t('Count the cash in the drawer before you start selling.')}</p>`+fld(t('Opening cash'),`<input name="cash" type="text" inputmode="decimal" data-money autocomplete="off" onfocus="this.select()" value="0" autofocus>`)+fld(t('Note'),`<input name="note">`),`<button class="btn" data-close>${t('Cancel')}</button><button class="btn pri" id="osOk">${t('Open shift')}</button>`,'sm');
  $('#osOk',m).onclick=()=>{const f=getForm(m);
    DB.shifts.push({id:uid(),branchId:S.branchId,userId:S.user.id,openAt:now(),openCash:rnd(f.cash),note:f.note,status:'open'});
    save();closeM(m);updateHeader();toast(t('Shift opened'),'ok');if(after)after();else if(S.route==='cash')renderView()};
}

/* ----- payment ----- */
function quickAmounts(total){
  const steps=cur()!=='MMK'?[1,5,10,20,50,100]:[1000,5000,10000,50000,100000];
  const out=[];steps.forEach(s=>{const v=Math.ceil(total/s)*s;if(v>=total&&!out.includes(v)&&v!==total)out.push(v)});return out.slice(0,4);
}
ACT.pay=()=>{
  const cart=getCart();if(!cart.lines.length)return toast(t('Cart is empty'),'warn');
  if(!curShift()&&shiftMode()==='required')return openShiftModal(()=>ACT.pay());
  if(DB.settings.closeBlock&&closeDue(curShift()))return toast(t('Closing time has passed. Close the shift first.'),'warn');
  const c=calcCart(cart);if(c.total<=0)return toast(t('Total must be greater than zero'),'warn');
  payDialog(c,cart,rows=>finishSale(c,rows),{cod:codOn(),credit:creditOn()});
};
function payDialog(c,cart,onOk,o={}){
  const P={rows:[{method:'Cash',amount:c.total}]};
  const methods=DB.settings.payMethods.includes('Cash')?DB.settings.payMethods:['Cash',...DB.settings.payMethods];
  const m=modal(o.title||t('Payment'),`<div class="c"><div class="mut">${t('Total due')}</div><div style="font-size:46px;line-height:1.15;font-weight:800;color:var(--pri);margin-top:2px">${money(c.total)}</div></div><div id="payCh" class="row wrap mt" style="justify-content:center"></div><div id="payBody" class="mt"></div><div id="paySum" class="mt"></div>`,
    `<button class="btn" data-close>${t('Cancel')}</button><button class="btn" id="addPay">+ ${t('Split payment')}</button>${o.cod?`<button class="btn" id="codBtn" style="border-color:var(--warn);color:var(--warn)">${ic('truck')} ${t('Cash on Delivery')}</button>`:''}${o.credit?`<button class="btn" id="crBtn" style="border-color:var(--err);color:var(--err)">${ic('customers')} ${t('On credit')}</button>`:''}<button class="btn ok lg" id="payOk" style="min-width:180px">${t('Complete sale')}</button>`,'md paymodal');
  const FX=fxList().filter(x=>x.rate>0);
  const rem=()=>rnd(c.total-sum(P.rows,r=>num(r.amount)));
  const setAmt=(r,j,base)=>{r.amount=base;if(r.cur)r.fx=fxRound(base/r.rate);const inp=$('[data-pa="'+j+'"]',m);if(inp)inp.value=r.cur?r.fx:base};
  function chUI(){const cc=chans(),el=$('#payCh',m);if(cc.length<2){el.classList.add('hide');return}
    el.innerHTML=`<span class="mut sm">${t('Channel')}</span><div class="chips">`+cc.map(x=>`<button class="chip ${cart.channel===x?'on':''}" data-pch="${esc(x)}">${esc(CHN(x))}</button>`).join('')+'</div>'}
  function bal(i){ // split: whatever is typed in one row is subtracted from the total and the rest goes to the last other row
    const n=P.rows.length;if(n<2)return;const j=(i===n-1)?n-2:n-1;
    const others=sum(P.rows.filter((_,k)=>k!==j),r=>num(r.amount));
    setAmt(P.rows[j],j,Math.max(0,rnd(c.total-others)))}
  function rows(){
    $('#payBody',m).innerHTML=P.rows.map((r,i)=>`<div class="payrow"><div class="row"><div class="paym sp">${methods.map(x=>`<span class="pm ${r.method===x?'on':''}" data-pm="${i}" data-m="${esc(x)}">${esc(PAYNAME(x))}</span>`).join('')}</div>${P.rows.length>1?`<button class="btn sm danger" data-prm="${i}">${ic('x')}</button>`:''}</div>
      ${FX.length&&r.method==='Cash'?`<div class="chips mt"><button class="chip ${!r.cur?'on':''}" data-pc="${i}" data-c="">${esc(cur())}</button>${FX.map(x=>`<button class="chip ${r.cur===x.code?'on':''}" data-pc="${i}" data-c="${esc(x.code)}">${esc(x.code)}</button>`).join('')}</div>`:''}
      <div class="row mt">${r.cur?`<span class="b" style="font-size:18px">${esc((FX.find(x=>x.code===r.cur)||{}).symbol||r.cur)}</span>`:''}<input type="text" inputmode="decimal" data-money autocomplete="off" data-pa="${i}" value="${r.cur?r.fx:r.amount}" style="font-size:18px;font-weight:600"></div>
      ${r.cur?`<div class="mut sm mt">= ${money(r.amount)} · 1 ${esc(r.cur)} = ${nf(r.rate)} ${esc(cur())}</div>`:''}
      ${r.method==='Cash'?`<div class="quick">${(()=>{const ex=Math.max(0,rnd(c.total-sum(P.rows.filter((_,j)=>j!==i),x=>num(x.amount))));
        if(r.cur){const st=[1,5,10,20,50,100,500,1000,5000,10000].filter(v=>v*r.rate>=c.total*.3&&v*r.rate<=c.total*20).slice(0,5);return `<button class="btn sm" data-pq="${i}" data-v="${Math.ceil(ex/r.rate*100)/100}">${t('Exact')}</button>`+st.map(v=>`<button class="btn sm" data-pq="${i}" data-v="${v}">${v}</button>`).join('')}

async function voidSale(s,m){
  if(num(s.recv)>0)return toast(t('Payments were already received for this sale — it cannot be voided.'),'err');
  const reason=await promptBox(t('Void sale'),t('Reason'),{required:true});if(reason==null)return;
  const cashPaid=sum(s.payments.filter(p=>p.method==='Cash'),p=>p.amount);
  const orig=DB.shifts.find(x=>x.id===s.shiftId);let refundShift=null;
  if(cashPaid>0&&orig&&orig.status==='closed'){
    refundShift=curShift(s.branchId);
    if(!refundShift)return toast(t('Open a shift first — the cash refund is recorded in your current shift'),'err');
  }
  s.status='void';s.voidReason=reason;s.voidAt=now();s.voidBy=S.user.id;
  s.items.forEach(i=>{const p=prod(i.pid);if(p&&p.trackStock!==false){addStock(p,s.branchId,i.qty);addMove({type:'void',pid:p.id,qty:i.qty,ref:s.no,branchId:s.branchId})}});
  if(refundShift)DB.cashEntries.push({id:uid(),branchId:s.branchId,shiftId:refundShift.id,date:now(),type:'out',kind:'refund',amount:cashPaid,reason:'Refund '+s.no,userId:S.user.id});
  save();toast(t('Sale voided'),'ok');closeM(m);renderView();
}

ACT.impXlsx=()=>{
  const m=modal(t('Import products from Excel'),`<p>${t('Columns')}: <code>sku, barcode, name, category, unit, cost, price, minStock, trackStock, stock</code></p><p class="mut sm">${t('Existing products are matched by barcode or SKU and updated. "stock" sets the stock level for the current branch ({b}).',{b:bname(S.branchId)})}</p>`,
    `<button class="btn" id="tplB">${ic('download')} ${t('Download template')}</button><button class="btn pri" id="pickB">${ic('upload')} ${t('Choose Excel file')}</button>`,'sm');
  $('#tplB',m).onclick=()=>dlBlob(simpleXlsx([PROD_COLS,['P1001','8851234567890','Sample Item','Snacks','pack',500,800,10,1,50]],'Products',PROD_W),'products-template.xlsx');
  $('#pickB',m).onclick=async()=>{
    const f=await readFile('.xlsx',false,true);if(!f)return;
    let rows;try{rows=await readXlsx(f.data)}catch(e){return toast(t('Could not read this Excel file')+': '+e.message,'err')}
    if(rows.length<2)return toast(t('File is empty'),'err');
    const h=rows[0].map(x=>String(x).trim().toLowerCase()),ix=k=>h.indexOf(k.toLowerCase());
    if(ix('name')<0)return toast(t('The file needs a "name" column'),'err');
    let add=0,upd=0;
    rows.slice(1).forEach(r=>{
      const g=k=>{const i=ix(k);return i<0?'':String(r[i]==null?'':r[i]).trim()};const name=g('name');if(!name)return;
      let p=(g('barcode')&&DB.products.find(x=>x.barcode===g('barcode')))||(g('sku')&&DB.products.find(x=>x.sku===g('sku')));
      let cid='';if(g('category')){let c=DB.categories.find(c=>c.name.toLowerCase()===g('category').toLowerCase());if(!c){c={id:uid(),name:g('category')};DB.categories.push(c)}cid=c.id}
      if(!p){p={id:uid(),stock:{},active:true,trackStock:true};DB.products.push(p);add++;if(!g('sku')){DB.counters.sku=(DB.counters.sku||0)+1;p.sku='P'+String(DB.counters.sku).padStart(4,'0')}}else upd++;
      Object.assign(p,{name,updatedAt:now()});if(g('sku'))p.sku=g('sku');if(g('barcode'))p.barcode=g('barcode');if(cid)p.categoryId=cid;if(g('unit'))p.unit=g('unit');
      if(g('cost')!=='')p.cost=num(g('cost'));if(g('price')!=='')p.price=num(g('price'));if(g('minstock')!=='')p.minStock=num(g('minstock'));if(g('trackstock')!=='')p.trackStock=!['0','false','no'].includes(g('trackstock').toLowerCase());
      if(g('stock')!==''){const d=num(g('stock'))-stockOf(p);if(d){addStock(p,S.branchId,d);addMove({type:'import',pid:p.id,qty:d,ref:'Excel'})}}
    });
    save();closeM(m);toast(t('Imported: {a} new, {u} updated',{a:add,u:upd}),'ok');renderView();
  };
};
ACT.expCSV=ACT.expXlsx;ACT.impCSV=ACT.impXlsx;

function presetRange(p){

  const k=x=>dkey(x);
  if(p==='today')return [k(d),k(d)];
  if(p==='yesterday'){const x=new Date();x.setDate(x.getDate()-1);return [k(x),k(x)]}
  if(p==='week'){const x=new Date();x.setDate(x.getDate()-6);return [k(x),k(d)]}
  if(p==='month')return [k(new Date(y,mo,1)),k(d)];
  if(p==='lastmonth')return [k(new Date(y,mo-1,1)),k(new Date(y,mo,0))];
  if(p==='year')return [k(new Date(y,0,1)),k(d)];

}

};

/* =====================================================================
   SCREEN LOCK  —  shortcut F4 (or Ctrl+Alt+L) · every account has its own 4-digit PIN
   ===================================================================== */
const LKEYS='spos_locked';let lkTry=0,lkUntil=0,lkBuf='';
const pinHash=(u,p)=>sha('pin|'+u.id+'|'+p);
const PININ='type="password" inputmode="numeric" maxlength="4" autocomplete="off" oninput="this.value=this.value.replace(/\\D/g,\'\')"';
function lockApply(){
  let el=document.getElementById('scrLock');
  if(!(S.user&&S.locked)){if(el)el.remove();[...document.body.children].forEach(c=>{if(c.inert)c.inert=false});return}
  if(!el){el=document.createElement('div');el.id='scrLock';
    el.innerHTML=`<div class="lk-pad hide" id="lkPad"></div><button class="lk-bar" id="lkBar" type="button">${ic('lock')}<b>${t('Locked')}</b><span>${t('Press F4 or click to unlock')}</span></button>`;
    document.body.appendChild(el);$('#lkBar',el).onclick=()=>lockPad();}
  [...document.body.children].forEach(c=>{if(c.id!=='scrLock')c.inert=true});
  try{document.activeElement&&document.activeElement.blur()}catch(e){}
}
function lockPad(open=true){
  const pad=$('#lkPad');if(!pad)return;
  if(!open||!pad.classList.contains('hide')){pad.classList.add('hide');lkBuf='';return}
  lkBuf='';lkDraw();pad.classList.remove('hide');
}
function lkDraw(msg){
  const pad=$('#lkPad');if(!pad||!S.user)return;const wait=Math.ceil((lkUntil-Date.now())/1000);
  pad.innerHTML=`<div class="lk-u">${ic('lock')} ${esc(S.user.name||S.user.username)}</div>
    <div class="lk-dots">${[0,1,2,3].map(i=>`<i class="${i<lkBuf.length?'on':''}"></i>`).join('')}</div>
    <div class="lk-msg">${wait>0?t('Too many attempts. Try again in {n}s',{n:wait}):(msg||t('Enter your 4-digit PIN'))}</div>
    <div class="lk-keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
    <button class="btn ghost sm" id="lkPw" type="button">${t('Use password instead')}</button>`;
  pad.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>lkKey(b.dataset.k));$('#lkPw',pad).onclick=lkPassword;
}
async function lkKey(k){
  if(Date.now()<lkUntil)return lkDraw();
  if(k==='⌫'||k==='Backspace')lkBuf=lkBuf.slice(0,-1);else if(/^\d$/.test(k)&&lkBuf.length<4)lkBuf+=k;
  lkDraw();if(lkBuf.length<4)return;
  const pin=lkBuf,ok=S.user.pin&&await pinHash(S.user,pin)===S.user.pin;
  if(ok)return lockOff();
  lkTry++;lkBuf='';const pad=$('#lkPad');if(!pad)return;pad.classList.remove('shake');void pad.offsetWidth;pad.classList.add('shake');
  if(lkTry>=5){lkTry=0;lkUntil=Date.now()+30000;lkDraw();setTimeout(()=>lkDraw(),30500)}else lkDraw(t('Wrong PIN'));
}
function lockOff(){S.locked=false;lkTry=0;lkBuf='';try{sessionStorage.removeItem(LKEYS)}catch(e){}lockApply()}
async function lkPassword(){
  const pw=await promptBox(t('Unlock with password'),t('Enter your account password (or an Admin password)'),{type:'password',required:true});if(!pw)return;
  for(const c of [S.user,...DB.users.filter(x=>x.role==='admin'&&x.active!==false)]){if(c&&await sha(c.username+'|'+pw)===c.passHash)return lockOff()}
  toast(t('Wrong password'),'err');
}
function pinSetup(first){
  return new Promise(res=>{
    const has=!!S.user.pin&&!first;
    const m=modal(first?t('Create your lock PIN'):t('My lock PIN'),`<p class="mut sm">${first?t('Choose a 4-digit PIN. You will need it to unlock the screen.'):t('Change the 4-digit PIN used to unlock the screen.')}</p>
      ${has?fld(t('Current PIN'),`<input name="cur" ${PININ}>`):''}${fld(t('New PIN (4 digits)'),`<input name="n1" ${PININ} autofocus>`)}${fld(t('Confirm PIN'),`<input name="n2" ${PININ}>`)}`,
      `<button class="btn" data-close id="pnX">${t('Cancel')}</button><button class="btn pri" id="pnOk">${t('Save')}</button>`,'sm');
    $('#pnX',m).addEventListener('click',()=>res(false));
    $('#pnOk',m).onclick=async()=>{const f=getForm(m);
      if(has&&await pinHash(S.user,f.cur||'')!==S.user.pin)return toast(t('Current PIN is wrong'),'err');
      if(!/^\d{4}$/.test(f.n1||''))return toast(t('PIN must be exactly 4 digits'),'err');
      if(f.n1!==f.n2)return toast(t('The two PINs do not match'),'err');
      S.user.pin=await pinHash(S.user,f.n1);save();closeM(m);toast(t('PIN saved'),'ok');res(true)};
  });
}
ACT.lock=async()=>{
  if(!S.user||S.locked)return;
  if(!S.user.pin&&!await pinSetup(true))return;
  S.locked=true;try{sessionStorage.setItem(LKEYS,'1')}catch(e){}lockApply();
};
ACT.myAcct=()=>pinSetup(false);
addEventListener('keydown',e=>{
  if(!S.user)return;
  const isLockKey=e.key==='F4'||(e.ctrlKey&&e.altKey&&String(e.key).toLowerCase()==='l');
  if(S.locked){
    if(document.querySelector('body > .mbg'))return;           // password prompt is open
    e.preventDefault();e.stopPropagation();
    if(isLockKey)return lockPad();
    const pad=$('#lkPad');if(pad&&!pad.classList.contains('hide')){
      if(/^\d$/.test(e.key)||e.key==='Backspace')lkKey(e.key);else if(e.key==='Escape')lockPad(false)}
    return;
  }
  if(isLockKey&&!document.querySelector('body > .mbg')){e.preventDefault();e.stopPropagation();ACT.lock()}
},true);

(async function boot(){
  const fail=e=>{try{console.error(e)}catch(x){}const a=document.getElementById('app');if(a&&!a.children.length)a.innerHTML='<div style="padding:30px;font-family:sans-serif;color:#333;max-width:520px;margin:auto"><h3>Navotex could not start</h3><p style="color:#b91c1c;word-break:break-word">'+String(e&&e.message||e)+'</p><p>Try: close all tabs of this page and open it again. If it still fails, tell the support person the message above.</p><button onclick="location.reload()" style="padding:10px 18px;font-size:16px">Reload</button></div>'};
  window.addEventListener('error',ev=>{setTimeout(()=>{if(!document.getElementById('app').children.length)fail(ev.message)},300)});
  window.addEventListener('unhandledrejection',ev=>{setTimeout(()=>{if(!document.getElementById('app').children.length)fail(ev.reason)},300)});
  setTimeout(()=>{if(!document.getElementById('app').children.length)fail(new Error('Start-up took too long'))},9000);
  try{applyPrefs();await Promise.race([loadDB(),new Promise((_,r)=>setTimeout(()=>r(new Error('Loading data timed out')),6000))]);await Promise.race([licInit(),new Promise(r=>setTimeout(r,4000))]);}catch(e){return fail(e)}
  if(!LIC.rec)try{LIC.rec={start:new Date().toISOString(),seen:new Date().toISOString(),inst:'00000000',key:'',pay:null,ext:[],extDays:0};licEval()}catch(e){}
  try{const id=sessionStorage.getItem(SKEY),u=id&&DB.users.find(x=>x.id===id&&x.active!==false);
    if(u){S.user=u;const mb=myBranches(),sb=sessionStorage.getItem('spos_branch');S.branchId=(mb.find(b=>b.id===sb)||mb[0]||{}).id;if(!S.branchId)S.user=null;else S.locked=sessionStorage.getItem(LKEYS)==='1'}}catch(e){}
  try{renderApp()}catch(e){fail(e)}
})();
